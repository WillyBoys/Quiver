[project]
name = "quiver"
version = "0.1.0"
description = "AI-powered continuous penetration testing platform"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "WillyBoys", email = "125172858+WillyBoys@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

# Per-service dependencies are added as extras as each service is built
# (api, worker, bridge), so each container image installs only what it needs.

[project.optional-dependencies]
api = [
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    # Local development and tests get every service's dependencies.
    "quiver[api]",
    "httpx2>=2.13.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "SIM",      # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fixed test values are expected

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
