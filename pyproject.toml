[project]
name = "quiver"
version = "0.1.0"
description = "AI-powered continuous penetration testing platform"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "WillyBoys", email = "125172858+WillyBoys@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "idna>=3.20",
    "publicsuffixlist>=1.1.0.20261010",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

# Per-service dependencies are added as extras as each service is built
# (api, worker, bridge), so each container image installs only what it needs.

[project.optional-dependencies]
api = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
quiver-admin = "quiver.cli:main"

[dependency-groups]
dev = [
    # Local development and tests get every service's dependencies.
    "quiver[api]",
    "httpx2>=2.13.1",
    "pytest",
    "ruff",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "SIM",      # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]  # asserts and fixed test values are expected

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
