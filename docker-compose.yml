# Quiver v2 stack. First run:
#   python3 scripts/init_secrets.py
#   docker compose up -d --build
#
# Every published port is bound to 127.0.0.1. For remote access, use an SSH tunnel;
# do not change the bind address (Blueprint §11).

name: quiver

# Hardening shared by Quiver's own services.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quiver
      POSTGRES_USER: quiver
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    # No published port: only services on the backend network can reach the database.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiver -d quiver"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: applies database migrations, then exits. api and worker wait for it.
  migrate:
    <<: *hardened
    image: quiver-api:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["quiver-admin", "migrate"]
    restart: "no"
    environment:
      QUIVER_DB_HOST: db
      QUIVER_DB_NAME: quiver
      QUIVER_DB_USER: quiver
      QUIVER_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *hardened
    image: quiver-api:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "127.0.0.1:${QUIVER_API_PORT:-8000}:8000"
    environment:
      QUIVER_DB_HOST: db
      QUIVER_DB_NAME: quiver
      QUIVER_DB_USER: quiver
      QUIVER_DB_PASSWORD_FILE: /run/secrets/postgres_password
      QUIVER_SECRET_KEY_FILE: /run/secrets/api_secret_key
      QUIVER_CORS_ORIGINS: '["http://127.0.0.1:${QUIVER_UI_PORT:-3000}", "http://localhost:${QUIVER_UI_PORT:-3000}"]'
    secrets:
      - postgres_password
      - api_secret_key
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Gates jobs and hands allowed ones to the executor. Never starts a tool process.
  worker:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      QUIVER_DB_HOST: db
      QUIVER_DB_NAME: quiver
      QUIVER_DB_USER: quiver
      QUIVER_DB_PASSWORD_FILE: /run/secrets/postgres_password
      QUIVER_JOB_SPEC_DIR: /data/job_specs
      QUIVER_JOB_OUTPUT_DIR: /data/job_output
    secrets:
      - postgres_password
    volumes:
      - job_specs:/data/job_specs # the worker writes job specs and cancel files
      - job_output:/data/job_output:ro # written where tools run: read-only, untrusted
    networks:
      - backend # database, and DNS for the policy gate
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The only service that starts processes (Blueprint §3). No secrets, no database, and no
  # route to the backend network: a tool, even an approved run_command, cannot read Quiver's
  # credentials or reach its database. Specs are read-only here, so it cannot create jobs.
  # It is also the tools image (pinned binaries); passive tools use keyless sources only,
  # because nothing here may hold a secret (Blueprint §9).
  # cap_add stays empty until raw-socket scans need NET_RAW (nmap, step 11).
  executor:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/executor.Dockerfile
    volumes:
      - job_specs:/data/job_specs:ro
      - job_output:/data/job_output
    networks:
      - egress
    # On stop, running jobs are cancelled (whole process groups killed) before exit.
    stop_grace_period: 20s

  frontend:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${QUIVER_UI_PORT:-3000}:8080"
    # nginx writes its pid and temp files here; everything else stays read-only.
    tmpfs:
      - /tmp
      - /var/cache/nginx
    networks:
      - frontend

secrets:
  # Created by scripts/init_secrets.py. Compose refuses to start if any file is missing.
  postgres_password:
    file: ./secrets/postgres_password
  api_secret_key:
    file: ./secrets/api_secret_key

volumes:
  pgdata:
  job_specs:
  job_output:

networks:
  backend:
  frontend:
  # Internet access for tools, and nothing else of Quiver's.
  egress:
