services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiver_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - ${WORDLISTS_PATH:-./data/wordlists}:/wordlists:ro
    environment:
      - DATABASE_URL=sqlite:////data/pentest.db
      - WORDLISTS_DIR=/wordlists
      - OLLAMA_URL=http://ai:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-phi3:mini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
    privileged: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quiver_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop
    container_name: quiver_juiceshop
    ports:
      - "3001:3000"
    restart: unless-stopped

  ai:
    image: ollama/ollama:latest
    container_name: quiver_ai
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ai-init:
    image: ollama/ollama:latest
    container_name: quiver_ai_init
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ai:11434
    depends_on:
      ai:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-phi3:mini}"]
    restart: "no"

volumes:
  ollama_data:

