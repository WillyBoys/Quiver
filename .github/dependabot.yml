# Weekly dependency update PRs. Minor and patch updates are grouped to keep PR volume low;
# security updates are raised separately as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python minor versions (3.12 -> 3.13) change the runtime under tested code: upgrade them
  # deliberately, together with .python-version, pyproject.toml, and CI. Patch updates only here.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Postgres major upgrades need a dump/restore of the data volume; never automatic.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
